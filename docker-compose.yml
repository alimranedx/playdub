version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: playdub_backend
    restart: unless-stopped
    tty: true
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: playdub
      DB_USERNAME: postgres
      DB_PASSWORD: secret
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - .:/var/www
    depends_on:
      - postgres
      - redis
    networks:
      - playdub_network

  queue-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: playdub_queue_worker
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --timeout=90
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: playdub
      DB_USERNAME: postgres
      DB_PASSWORD: secret
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - .:/var/www
    depends_on:
      - backend
      - redis
      - postgres
    networks:
      - playdub_network

  nginx:
    image: nginx:alpine
    container_name: playdub_nginx
    restart: unless-stopped
    tty: true
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - playdub_network

  postgres:
    image: postgres:16-alpine
    container_name: playdub_postgres
    restart: unless-stopped
    tty: true
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: playdub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - playdub_network

  redis:
    image: redis:7-alpine
    container_name: playdub_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - playdub_network

  python-worker:
    build:
      context: ./python_service
      dockerfile: Dockerfile
    container_name: playdub_python_worker
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./python_service:/app
      - ./storage/app:/var/www/storage/app
    depends_on:
      - redis
    networks:
      - playdub_network

networks:
  playdub_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
